services:
  - type: web
    name: casino-laujar
    env: node
    buildCommand: echo "Sin build (Node puro)"
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
    # Variables opcionales (añadir en el dashboard de Render):
    #   FIREBASE_DB_URL     → URL de Firebase Realtime Database
    #   FIREBASE_DB_SECRET  → Database secret (o FIREBASE_SERVICE_ACCOUNT con el JSON)
    #   DATA_DIR            → carpeta persistente para users/rooms/jackpot (si Render lo provee)
    #   JACKPOT_SEED        → valor inicial del jackpot (100 por defecto)
    #   JACKPOT_FILE        → ruta local completa del jackpot (si no se usa DATA_DIR)

  # ── Alternativa: cron para limpieza de salas inactivas (opcional) ──
  # - type: cron
  #   name: gc-inactive-rooms
  #   schedule: "0 * * * *"   # cada hora
  #   command: node scripts/gc.js
